[package]
name = "cyrio-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Web (WASM) entry point for cyrio"

[[bin]]
name = "cyrio-web"
path = "src/main.rs"

[dependencies]
cyrio-app.workspace = true
cyrio-core.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HashChangeEvent",
    "Location",
    "Console",
] }
js-sys.workspace = true
console_log = "1.0"
