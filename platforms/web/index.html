<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyrio - Diamond Rio S-Series Manager</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
        }
    </style>
</head>
<body>
    <div id="loading">加载 cyrio…</div>
    <canvas id="canvas"></canvas>
    <script type="module">
        import init, { start } from './pkg/cyrio_web.js';

        async function main() {
            await init();
            const canvas = document.getElementById('canvas');
            canvas.id = 'cyrio-canvas';
            await start('cyrio-canvas');
            document.getElementById('loading').remove();
        }

        main().catch(err => {
            console.error('cyrio 启动失败:', err);
            document.getElementById('loading').textContent = '启动失败: ' + err;
        });
    </script>
</body>
</html>
