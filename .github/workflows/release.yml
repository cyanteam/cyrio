name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            patchelf \
            nodejs \
            npm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: platforms/tauri-desktop/frontend
        run: |
          npm install
          npm run build

      - name: Build Tauri binary
        run: cargo build --release -p cyrio-tauri

      - name: Rename binary
        run: cp target/release/cyrio-tauri target/release/cyrio-tauri_${{ github.event.inputs.tag }}_linux-x86_64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: target/release/cyrio-tauri_${{ github.event.inputs.tag }}_linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: platforms/tauri-desktop/frontend
        run: |
          npm install
          npm run build

      - name: Build Tauri binary
        run: cargo build --release -p cyrio-tauri

      - name: Rename binary
        shell: bash
        run: cp target/release/cyrio-tauri.exe target/release/cyrio-tauri_${{ github.event.inputs.tag }}_windows-x86_64.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: target/release/cyrio-tauri_${{ github.event.inputs.tag }}_windows-x86_64.exe
