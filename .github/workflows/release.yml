name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  # ============================================================
  # 桌面端构建（macOS arm64 / macOS x86_64 / Windows / Linux）
  # ============================================================
  build-desktop:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact: cyrio-tauri_${{ github.event.inputs.tag }}_macos-arm64.dmg
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
            artifact: cyrio-tauri_${{ github.event.inputs.tag }}_macos-x86_64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            artifact: cyrio-tauri_${{ github.event.inputs.tag }}_windows-x86_64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            artifact: cyrio-tauri_${{ github.event.inputs.tag }}_linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.label == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: platforms/tauri-desktop/frontend
        run: |
          npm install
          npm run build

      - name: Build Tauri app (macOS)
        if: startsWith(matrix.label, 'macos')
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: platforms/tauri-desktop

      - name: Build Tauri app (Windows)
        if: matrix.label == 'windows-x86_64'
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: platforms/tauri-desktop

      - name: Build Tauri app (Linux)
        if: matrix.label == 'linux-x86_64'
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: platforms/tauri-desktop

      - name: Prepare macOS artifact
        if: startsWith(matrix.label, 'macos')
        run: |
          DMG=$(find target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)
          cp "$DMG" "${{ matrix.artifact }}"

      - name: Prepare Windows artifact
        if: matrix.label == 'windows-x86_64'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "target\${{ matrix.target }}\release\bundle\nsis\*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "${{ matrix.artifact }}"

      - name: Prepare Linux artifact
        if: matrix.label == 'linux-x86_64'
        run: |
          cp target/${{ matrix.target }}/release/cyrio-tauri "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}

  # ============================================================
  # Android 构建（arm64-v8a）
  # ============================================================
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Write CI cargo config
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          cat > .cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          ar = "$TOOLCHAIN/bin/llvm-ar"
          rustflags = [
            "-C", "link-arg=-Wl,-z,max-page-size=16384",
            "-C", "link-arg=-Wl,-z,common-page-size=16384",
          ]
          [env]
          CC_aarch64_linux_android = "$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          CXX_aarch64_linux_android = "$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          AR_aarch64_linux_android = "$TOOLCHAIN/bin/llvm-ar"
          EOF

      - name: Cross-compile cyrio-jni
        run: cargo build --release -p cyrio-jni --target aarch64-linux-android

      - name: Copy .so to jniLibs
        run: |
          mkdir -p platforms/android-native/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcyrio_jni.so \
             platforms/android-native/app/src/main/jniLibs/arm64-v8a/libcyrio_jni.so

      - name: Build APK
        working-directory: platforms/android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android artifact
        run: |
          cp platforms/android-native/app/build/outputs/apk/release/app-release-unsigned.apk \
             cyrio-android_${{ github.event.inputs.tag }}_arm64-v8a.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: cyrio-android_${{ github.event.inputs.tag }}_arm64-v8a.apk

  # ============================================================
  # 发布 Release
  # ============================================================
  create-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }} - 全平台桌面版 + Android
          body: |
            ## 更新内容

            - 新增演示模式（无需连接设备即可预览全部功能）
            - 优化顶部栏为纯文本选项卡紧凑布局
            - 修复刷新按钮文字换行问题
            - 歌单详情返回按钮改为纯图标
            - 更新 README 文档（截图展示 + 软件优势）
            - 补充演示模式 mock 数据覆盖全部 API 命令

            ## 下载

            | 文件 | 平台 |
            |------|------|
            | `*_macos-arm64.dmg` | macOS Apple Silicon |
            | `*_macos-x86_64.dmg` | macOS Intel |
            | `*_windows-x86_64.exe` | Windows x86_64 |
            | `*_linux-x86_64` | Linux x86_64 |
            | `*_arm64-v8a.apk` | Android arm64 |
          files: artifacts/**/*
          prerelease: false
