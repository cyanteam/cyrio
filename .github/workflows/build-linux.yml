name: Build Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            patchelf \
            nodejs \
            npm

      - name: Clone cyrio-core private source
        env:
          CYRIO_CORE_TOKEN: ${{ secrets.CYRIO_CORE_TOKEN }}
        run: |
          git clone https://x-access-token:${CYRIO_CORE_TOKEN}@github.com/cyanteam/cyrio-core.git /tmp/cyrio-core-src
          cp -r /tmp/cyrio-core-src/crates/cyrio-core/src crates/cyrio-core/src
          cp -r /tmp/cyrio-core-src/crates/cyrio-text/src crates/cyrio-text/src

      - name: Build frontend
        working-directory: platforms/tauri-desktop/frontend
        run: |
          npm install
          npm run build

      - name: Build Tauri app
        run: cargo build --release -p cyrio-tauri

      - name: Rename binary
        run: |
          cp target/release/cyrio-tauri target/release/cyrio-tauri_0.1.0_linux-x86_64

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.CYRIO_CORE_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @target/release/cyrio-tauri_0.1.0_linux-x86_64 \
            "https://uploads.github.com/repos/cyanteam/cyrio/releases/363501979/assets?name=cyrio-tauri_0.1.0_linux-x86_64"
